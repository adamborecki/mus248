<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ring Out!: a final-exam practice game for MUS 248, using the quiz question bank.">
  <title>Ring Out! · MUS 248</title>
  <link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../games.css">
  <style>
    .ro-rack { display:grid; grid-template-columns:3.2rem 1fr; gap:.75rem; padding:.8rem; border-radius:.6rem; background:var(--rack); color:var(--rack-ink); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); transition:box-shadow .2s; }
    .ro-rack.ro-danger { box-shadow:inset 0 0 0 2px var(--bad), 0 0 24px -4px var(--bad); }
    .ro-meter { position:relative; height:11rem; overflow:hidden; border-radius:.35rem; background:#000; }
    .ro-fill { position:absolute; inset:auto 0 0; height:25%; transition:background .2s; }
    .ro-pct { position:absolute; inset:auto 0 .3rem; text-align:center; font-weight:800; font-size:.8rem; font-variant-numeric:tabular-nums; color:#fff; mix-blend-mode:difference; }
    .ro-eq { display:grid; grid-template-columns:repeat(13, minmax(0,1fr)); gap:3px; height:11rem; }
    .ro-band { position:relative; display:grid; grid-template-rows:1fr auto; justify-items:center; min-width:0; }
    .ro-spec { position:absolute; bottom:1.1rem; left:15%; right:15%; height:20%; border-radius:2px 2px 0 0; background:linear-gradient(0deg, #2ea44f, #a6e22e); opacity:.55; }
    .ro-ringing .ro-spec { background:linear-gradient(0deg, #f2a900, #ff453a); opacity:1; animation:ro-buzz .12s steps(2) infinite; }
    @keyframes ro-buzz { 50% { transform:translateX(1px); } }
    .ro-slot { position:relative; width:3px; height:100%; margin-bottom:.2rem; background:rgba(255,255,255,.25); border-radius:2px; }
    .ro-knob { position:absolute; left:50%; top:50%; width:14px; height:8px; transform:translate(-50%,-50%); border-radius:2px; background:#ddd; box-shadow:0 1px 0 #000; transition:top .5s cubic-bezier(.3,1.5,.6,1); }
    .ro-ringing .ro-knob { background:#ff453a; }
    .ro-band small { font-size:.58rem; color:rgba(255,255,255,.65); white-space:nowrap; }
    .ro-ringing small { color:#ff8a80; font-weight:800; }
    .ro-callout { min-height:1.5em; margin:.5rem 0; font-weight:800; text-align:center; font-size:1.05rem; }
    .ro-card { padding:.85rem 1rem; border:1px solid var(--line); border-radius:.6rem; background:var(--surface); }
    .ro-prompt { margin:0 0 .7rem; font-size:1.08rem; font-weight:650; line-height:1.35; }
    .ro-choices { display:grid; gap:.45rem; }
    .ro-choices button { display:flex; gap:.6rem; align-items:flex-start; padding:.6rem .7rem; border:2px solid var(--line); border-radius:.45rem; background:var(--paper); color:var(--ink); text-align:left; font-size:.95rem; line-height:1.3; }
    .ro-choices button:hover:not(:disabled) { border-color:var(--accent); }
    .ro-choices b { flex:0 0 auto; display:grid; place-items:center; width:1.45rem; height:1.45rem; border-radius:50%; background:var(--tag); font-size:.8rem; }
    .ro-right { border-color:var(--good) !important; background:color-mix(in srgb, var(--good) 14%, var(--paper)) !important; }
    .ro-wrong { border-color:var(--bad) !important; background:color-mix(in srgb, var(--bad) 14%, var(--paper)) !important; }
    .ro-dim { opacity:.45; }
    @media (max-width:560px) {
      .ro-rack { grid-template-columns:2.4rem 1fr; gap:.5rem; padding:.55rem; }
      .ro-meter, .ro-eq { height:8.5rem; }
      .ro-band small { font-size:.5rem; }
      .ro-band:nth-child(even) small { visibility:hidden; }
      .ro-prompt { font-size:1rem; }
    }
    @media (prefers-reduced-motion: reduce) { .ro-ringing .ro-spec { animation:none; } }
  </style>
</head>
<body>
  <main class="gm-page" id="game"><p class="quiet">Loading…</p></main>
  <script type="module" src="ring-out.js"></script>
</body>
</html>
